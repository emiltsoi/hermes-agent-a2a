name: hermes-agent-a2a
version: "3.2.18"
description: |
  A2A (Agent-to-Agent) protocol plugin for Hermes Agent.
  Self-contained: exposes discovery, protocol task, session-message,
  local-worker, and remote-worker tools through the a2a toolset.
  Supports Hermes fleet identities and direct external A2A-compatible agents.
requires_env: []
