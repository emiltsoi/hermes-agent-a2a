[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-a2a"
version = "3.1.5"
description = "A2A protocol plugin for Hermes Agent — self-contained, fleet-agnostic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=8",
  "PyYAML>=6",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/emiltsoi/hermes-agent-a2a"
Repository = "https://github.com/emiltsoi/hermes-agent-a2a"
Issues = "https://github.com/emiltsoi/hermes-agent-a2a/issues"

[tool.hatch.build.targets.wheel]
packages = ["hermes_agent_a2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
