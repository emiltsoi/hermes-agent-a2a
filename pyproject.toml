[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-a2a"
version = "3.3.10"
description = "⛔ RETIRED 2026-08-04 — use Hermes ≥0.20.0 native A2A (a2a-platform) or hermes-mesh (mesh_send). Archived; no releases planned."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["httpx>=0.27", "PyJWT>=2.8"]
license = {text = "MIT"}
license-files = []

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=8",
  "PyYAML>=6",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/emiltsoi/hermes-agent-a2a"
Repository = "https://github.com/emiltsoi/hermes-agent-a2a"
Issues = "https://github.com/emiltsoi/hermes-agent-a2a/issues"

[tool.hatch.build.targets.wheel]
packages = ["hermes_agent_a2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
