[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-a2a"
version = "3.3.5"
description = "⚠️ DEPRECATED — Archived June 2026. Standard A2A now natively supported by upstream Hermes A2A platform adapter. Fleet session relay extracted to hermes-mesh (pip install hermes-mesh). This package is preserved for history only — no further releases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "PyJWT>=2.8"]
license = {text = "MIT"}
license-files = []

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=8",
  "PyYAML>=6",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/emiltsoi/hermes-agent-a2a"
Repository = "https://github.com/emiltsoi/hermes-agent-a2a"
Issues = "https://github.com/emiltsoi/hermes-agent-a2a/issues"

[tool.hatch.build.targets.wheel]
packages = ["hermes_agent_a2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
