[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-a2a"
version = "3.2.19"
description = "A2A HTTP/JSON-RPC protocol plugin for Hermes — Google A2A v1.0 spec-compliant (SendMessage, GetTask, CancelTask), fleet session relay with full sender context, platform-independent gateway hook float, HMAC-signed push notifications, and SSE streaming."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "PyJWT>=2.8"]
license = {text = "MIT"}
license-files = []

[project.optional-dependencies]
dev = [
  "build>=1",
  "pytest>=8",
  "PyYAML>=6",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/emiltsoi/hermes-agent-a2a"
Repository = "https://github.com/emiltsoi/hermes-agent-a2a"
Issues = "https://github.com/emiltsoi/hermes-agent-a2a/issues"

[tool.hatch.build.targets.wheel]
packages = ["hermes_agent_a2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
